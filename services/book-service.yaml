server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:12500/book_db
    username: postgres
    password: psql
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
# Custom Property for Image Upload Directory
file:
  upload-dir: uploads/images/

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka/
    register-with-eureka: true
    fetch-registry: true
